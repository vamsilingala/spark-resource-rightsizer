[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-job-rightsizer"
version = "0.2.0"
description = "Independent provider-neutral Spark capacity assessment toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Vamsi Lingala"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
databricks = [
  "databricks-sdk>=0.40,<1",
  "databricks-sql-connector>=3,<5",
]
aws-glue = [
  "boto3>=1.34,<2",
]
cloud-files = [
  "fsspec>=2024.12,<2027",
]
aws-files = [
  "fsspec>=2024.12,<2027",
  "s3fs>=2024.12,<2027",
]
azure-files = [
  "fsspec>=2024.12,<2027",
  "adlfs>=2024.12,<2027",
]
gcp-files = [
  "fsspec>=2024.12,<2027",
  "gcsfs>=2024.12,<2027",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
spark-rightsizer = "spark_rightsizer.cli:main"

[project.urls]
Homepage = "https://github.com/vamsilingala/spark-job-rightsizer"
Issues = "https://github.com/vamsilingala/spark-job-rightsizer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
