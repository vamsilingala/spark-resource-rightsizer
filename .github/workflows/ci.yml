name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: python -m compileall -q src tests

  provider-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[databricks,aws-glue,aws-files,azure-files,gcp-files]'
      - name: Verify cloud adapters and filesystem protocols
        run: >-
          python -c "import boto3, fsspec, databricks.sdk, databricks.sql;
          from spark_rightsizer.connectors.databricks import DatabricksConnector;
          from spark_rightsizer.connectors.glue import GlueConnector;
          [fsspec.get_filesystem_class(p) for p in
          ('s3', 'abfs', 'abfss', 'az', 'gs', 'gcs')]"
